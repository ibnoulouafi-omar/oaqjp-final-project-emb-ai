<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emotion Detector</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='mywebscript.js') }}" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">WATSON NLP · TEXT ANALYSIS</p>
    <h1>Emotion Detector</h1>
    <p class="intro">Explore the emotions expressed in a sentence.</p>
    <form id="emotion-form">
      <label for="textToAnalyze">Text to analyze</label>
      <textarea id="textToAnalyze" rows="5"></textarea>
      <p class="hint">Enter a sentence in English.</p>
      <button type="submit">Analyze emotions <span aria-hidden="true">→</span></button>
    </form>
    <section aria-labelledby="result-title">
      <h2 id="result-title">Result of emotion detection</h2>
      <div id="system_response" role="status" aria-live="polite">Your analysis will appear here.</div>
    </section>
    <footer>Anger · Disgust · Fear · Joy · Sadness</footer>
  </main>
</body>
</html>
